<div class="dashboard-topbar">

  <div class="topbar-left">

    <!-- EDIT BUTTON -->
    <button id="editBtn" class="btn-edit" onclick="toggleEditMode(true)">
      <i class="fas fa-pen"></i>
    </button>

    <!-- EDIT ACTIONS (SAVE + CANCEL) -->
    <div id="editActions" class="edit-actions hidden">

      <button class="btn-cancel" onclick="cancelEdit()">
        <i class="fas fa-times"></i>
      </button>

      <button class="btn-save" onclick="saveDashboard()">
        <i class="fas fa-save"></i>
      </button>

    </div>

  </div>

</div>
