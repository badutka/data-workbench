<!doctype html>
{% load static %}
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="shortcut icon" type="image/png" href="{% static 'images/image.png' %}" >

    <!--  COMMON CSS FILES -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CUSTOM COMMON CSS FILES -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/app_layout.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/main_menu_sidebar.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/scrollbars.css' %}">

    <link rel="stylesheet" type="text/css" href="{% static 'dashboard/css/dropdown_single_value.css' %}">
    
   
    <!-- APP SPECIFIC CSS FILES -->
    {% block extra_css %}{% endblock %}

</head>
<body class="">
    {% csrf_token %}

    <div class="app-shell">

        {% include "navbar.html" %}

        <div class="app-body">

            {% include "main_menu_sidebar_new.html" %}

            <main class="app-content">
                {% block content %}{% endblock %}
            </main>

        </div>

    </div>

    <!--  COMMON JS -->
    <script defer src="https://unpkg.com/htmx.org/dist/htmx.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <!-- APP SPECIFIC JS FILES -->
    {% block extra_js %}{% endblock %}
    
</body>
</html>
